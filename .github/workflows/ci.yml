name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # ruff pinned here, not left to the dev extra's floor: a new release can change the formatter's
      # style or promote a rule, and that should arrive as a deliberate bump rather than a red main.
      - run: pip install -e ".[dev]" "ruff==0.16.9"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  oldest-dependencies:
    # Several of the protections the tests check come from PyJWT itself, and the FastAPI extra
    # claims 0.100, so the declared floors are only promises if something runs against them.
    # FastAPI 0.100's Starlette needs httpx for its TestClient rather than httpx2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]" "pyjwt[crypto]==2.13.*" "fastapi==0.100.*" "httpx<0.28"
      - run: pytest -q
